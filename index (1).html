<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in | Brand Experience Summit</title><link rel="stylesheet" href="/assets/style.css"></head><body><div class="ambient"></div><div class="wrap"><header><span>28.11.2026 · Chișinău</span><span>Capitoles Park</span></header><div class="hero center"><div class="eyebrow">BRAND EXPERIENCE SUMMIT</div><h1>Check-in</h1><p>Introdu codul personal primit prin e-mail sau deschide linkul QR personal.</p></div><div class="panel"><label for="code">Cod personal</label><input id="code" placeholder="BESXXXXXXXXXX" autocapitalize="characters" maxlength="13"><div class="actions"><button id="go">Confirmă prezența</button></div><p id="status" role="status"></p></div></div><script>const token=new URLSearchParams(location.search).get('token');async function go(){document.getElementById('status').textContent='Se verifică...';try{const r=await fetch('/api/checkin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(token?{token}:{code:document.getElementById('code').value})});const d=await r.json();document.getElementById('status').textContent=r.ok?(d.already?'Prezența era deja confirmată. ':'Prezență confirmată! ')+d.name:({CHECKIN_CLOSED:'Check-in-ul nu este încă deschis.',NOT_FOUND:'Codul nu a fost găsit.',INVALID_CODE:'Cod invalid.'}[d.error]||'Eroare: '+d.error)}catch(e){document.getElementById('status').textContent='Eroare de conexiune.'}}document.getElementById('go').onclick=go;if(token)go();</script></body></html>
